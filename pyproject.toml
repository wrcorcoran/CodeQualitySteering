[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "cs291a-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.13.0",
    "bigcodebench>=0.2.2",
    "datasets>=4.8.4",
    "loguru>=0.7.3",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "numpy>=2.4.4",
    "packaging>=26.1",
    "pillow>=12.2.0",
    "pyarrow>=24.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "safetensors>=0.7.0",
    "torch==2.11.0+cu126",
    "torchvision==0.26.0+cu126",
    "tqdm>=4.67.3",
    "transformers>=5.5.4",
    "typer>=0.24.1",
    "scienceplots>=2.2.1",
    "steering-vectors",
    "nltk>=3.9.4",
    "scipy>=1.17.1",
    "librosa>=0.11.0",
    "soundfile>=0.13.1",
    "pandas>=3.0.2",
    "beautifulsoup4>=4.14.3",
    "lxml>=6.1.1",
    "requests>=2.33.1",
    "sympy>=1.14.0",
    "cvxpy>=1.8.2",
    "seaborn>=0.13.2",
    "chardet>=7.4.3",
    "pytesseract>=0.3.13",
    "statsmodels>=0.14.6",
    "pytz>=2026.2",
    "bitsandbytes>=0.49.2",
    "openpyxl>=3.1.5",
    "blake3>=1.0.8",
    "cryptography>=48.0.0",
    "datetime>=6.0",
    "django>=5.2.14",
    "dnspython>=2.8.0",
    "docxtpl>=0.20.2",
    "faker>=40.19.1",
    "flask-login>=0.6.3",
    "flask-restful>=0.3.10",
    "flask-wtf>=1.3.0",
    "flask-mail>=0.10.0",
    "flask>=3.1.3",
    "folium>=0.20.0",
    "gensim>=4.4.0",
    "geopandas>=1.1.3",
    "geopy>=2.4.1",
    "holidays>=0.97",
    "levenshtein>=0.27.3",
    "mechanize>=0.4.10",
    "natsort>=8.4.0",
    "networkx>=3.6.1",
    "numba>=0.65.1",
    "opencv-python-headless>=4.13.0.92",
    "prettytable>=3.17.0",
    "psutil>=7.2.2",
    "pycryptodome>=3.23.0",
    "pyfakefs>=6.2.0",
    "pyquery>=2.0.1",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "requests-mock>=1.12.1",
    "rsa>=4.9.1",
    "scikit-image>=0.26.0",
    "selenium>=4.44.0",
    "sendgrid>=6.12.5",
    "shapely>=2.1.2",
    "textblob>=0.20.0",
    "texttable>=1.7.0",
    "wikipedia>=1.4.0",
    "wordcloud>=1.9.6",
    "wordninja>=2.0.0",
    "wtforms>=3.2.2",
    "xlrd>=2.0.2",
    "xlwt>=1.3.0",
    "xmltodict>=1.0.4",
    "python-levenshtein-wheels>=0.13.2",
]

[project.optional-dependencies]
int8 = [
    "bitsandbytes>=0.49.2",
]

[tool.uv]
override-dependencies = [
    "transformers>=5.5.4",
    "vllm; python_version == '2.7'",  # bigcodebench pulls vllm; we don't use it and it can't build
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu126"
name = "pytorch-cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
