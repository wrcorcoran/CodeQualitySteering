[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "cs291a-project"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.4",
    "loguru>=0.7.3",
    "numpy>=2.4.4",
    "packaging>=26.1",
    "pyarrow>=24.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "radon>=6.0.1",
    "safetensors>=0.7.0",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
    "transformers>=5.5.4",
    "typer>=0.24.1",
]

[project.optional-dependencies]
int8 = [
    "bitsandbytes>=0.49.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
