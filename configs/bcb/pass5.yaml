subset: full
n_samples: 5
temperature: 0.2
batch_size: 16
limit: 3
p: 10

runs:
  - name: pass5_llama_base
    model: llama3.1_8b

  - name: pass5_llama_comment_ratio
    model: llama3.1_8b
    metric: comment_ratio
    layer: 30
    alpha_sweep: [-1.0, -0.75, -0.5, -0.25, 0.25, 0.5, 0.75, 1.0]

  - name: pass5_gemma_base
    model: gemma2_9b

  - name: pass5_gemma_comment_ratio
    model: gemma2_9b
    metric: comment_ratio
    layer: 30
    alpha_sweep: [-1.5, -1.0, -0.5, 0.5, 1.0, 1.5]

  - name: pass5_qwen_base
    model: qwen2.5_coder_14b

  - name: pass5_qwen_comment_ratio
    model: qwen2.5_coder_14b
    metric: comment_ratio
    layer: 38
    alpha_sweep: [-2.5, 2.5, -5.0, 5.0, -10.0, 10.0]
